services:

  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-db
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: "OracleContainer_2026"
      APP_USER: "vetly_app"
      APP_USER_PASSWORD: "VetlyApp_2026"
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - vetly-network

    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  vetly-app:
    build: .
    image: annaclrl/vetly-java:v1.0
    container_name: vetly-app
    restart: unless-stopped
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:oracle:thin:@oracle-db:1521/XEPDB1"
      SPRING_DATASOURCE_USERNAME: "vetly_app"
      SPRING_DATASOURCE_PASSWORD: "VetlyApp_2026"
      JWT_SECRET: "vetly-secret-cloud"
      APP_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - vetly-network

networks:
  vetly-network:
    driver: bridge

volumes:
  oracle_data: